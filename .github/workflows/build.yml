name: build
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Resolve CI package set
        run: |
          ./scripts/ci-go-packages.sh > "$RUNNER_TEMP/ci-go-packages.txt"
          test -s "$RUNNER_TEMP/ci-go-packages.txt"
      - name: Build
        run: |
          xargs go build -race < "$RUNNER_TEMP/ci-go-packages.txt"
      - name: Test
        run: |
          xargs go test -race -failfast < "$RUNNER_TEMP/ci-go-packages.txt"
