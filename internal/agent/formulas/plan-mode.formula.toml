formula = "plan-mode"
description = """
Formula-driven plan mode for Sapphire CLI.
"""
type = "workflow"
version = 1

[vars.task]
description = "Primary task to solve"
required = true

[vars.context]
description = "Supplemental task context"
required = false
default = ""

[vars.task_slug]
description = "Filesystem-safe task slug"
required = true

[[steps]]
id = "understand"
title = "Understand"
description = """
Restate the task `{{task}}`, identify hard requirements, and capture the constraints, acceptance bar, and major unknowns that matter.
"""
acceptance = "Task is restated with requirements and ambiguities."

[[steps]]
id = "analyze"
title = "Analyze"
needs = ["understand"]
description = """
Inspect the repo and identify the files, packages, and runtime seams involved in `{{task}}`.
Use the available read-only tools before making assumptions.
"""
acceptance = "Relevant files and seams are identified."

[[steps]]
id = "launch-exploration"
title = "Launch Exploration"
needs = ["analyze"]
description = """
Launch 5 read-only exploration checks in parallel using these exact dimensions:
- requirements
- gaps
- ambiguity
- feasibility
- scope

Each check must return a short structured report with:
- `<verdict>PASS|PASS_WITH_NOTES|FAIL</verdict>`
- `<must_fix>...</must_fix>`
- `<should_fix>...</should_fix>`
- `<observations>...</observations>`
"""
acceptance = "Five specialized exploration checks have been launched."

[[steps]]
id = "wait-exploration"
title = "Wait For Exploration"
needs = ["launch-exploration"]
description = """
Wait for the exploration agents to finish and gather their results.
"""
acceptance = "All launched exploration agents have completed."

[[steps]]
id = "synthesize-findings"
title = "Synthesize Findings"
needs = ["wait-exploration"]
description = """
Read all 5 exploration reports, consolidate must-fix items, determine the overall verdict, and write the synthesis report to `.plans/{{task_slug}}/05-synthesis.md`.

Report structure:
- `<synthesis>`
- `<overall_verdict>GO|GO_WITH_FIXES|NO_GO</overall_verdict>`
- `<must_fix_count>N</must_fix_count>`
- `<should_fix_count>N</should_fix_count>`
- `<observation_count>N</observation_count>`
- `</synthesis>`
- then markdown sections: Overall Verdict, Must Fix, Should Fix, Observations

If the verdict is NO_GO, revisit understanding and analysis based on the must-fix findings before plan design can continue.
"""
acceptance = "Synthesis file exists at .plans/{{task_slug}}/05-synthesis.md."

[[steps]]
id = "design"
title = "Design"
needs = ["synthesize-findings"]
description = """
Describe the implementation approach, phases, major files, dependencies, and risks for `{{task}}`, incorporating the synthesis findings and resolving every must-fix item.
"""
acceptance = "Implementation design is complete."

[[steps]]
id = "plan"
title = "Plan"
needs = ["design"]
description = """
Write a detailed markdown implementation plan for `{{task}}`.
The final plan must be decision-complete and suitable for direct implementation.
"""
acceptance = "Plan file exists at .plans/{{task_slug}}/04-plan.md."

[[steps]]
id = "gate-approval"
title = "Gate Approval"
needs = ["plan"]
description = """
Pause and ask the human: Ready to implement?
Wait for explicit approval before continuing.
"""
acceptance = "Human approval has been granted."

[[steps]]
id = "execute-phase-1"
title = "Execute Phase 1"
needs = ["gate-approval"]
description = """
Execute the setup phase from the approved plan for `{{task}}`.
"""
acceptance = "Setup phase completed."

[[steps]]
id = "execute-phase-2"
title = "Execute Phase 2"
needs = ["execute-phase-1"]
description = """
Execute the main implementation phase from the approved plan.
"""
acceptance = "Implementation phase completed."

[[steps]]
id = "execute-phase-3"
title = "Execute Phase 3"
needs = ["execute-phase-2"]
description = """
Run targeted tests, build checks, and fix failures caused by the implementation.
"""
acceptance = "Validation phase completed."

[[steps]]
id = "execute-phase-4"
title = "Execute Phase 4"
needs = ["execute-phase-3"]
description = """
Verify the final acceptance criteria and produce a concise completion summary.
"""
acceptance = "Final verification completed."
